<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle border outline -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Inner subtle ambient circle -->
  <circle cx="256" cy="230" r="170" fill="url(#primaryGrad)" opacity="0.08" />

  <!-- Modern House & High-rise combo icon in center -->
  <g filter="url(#glow)">
    <!-- High-rise Building Left -->
    <rect x="140" y="190" width="80" height="170" rx="12" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="6" />
    <rect x="158" y="215" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="186" y="215" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="158" y="247" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="186" y="247" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="158" y="279" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="186" y="279" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="158" y="311" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="186" y="311" width="16" height="16" rx="3" fill="#38bdf8" opacity="0.9" />

    <!-- Center Villa / House -->
    <path d="M 230 150 L 370 250 L 370 360 L 230 360 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Roof accent line -->
    <path d="M 215 152 L 375 256" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- House Door & Windows -->
    <rect x="285" y="280" width="36" height="80" rx="6" fill="url(#accentGrad)" opacity="0.9" />
    <rect x="260" y="200" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.95" />
    <circle cx="276" cy="216" r="6" fill="#0f172a" />
  </g>

  <!-- Key accent emblem -->
  <g transform="translate(320, 290)">
    <circle cx="36" cy="36" r="28" fill="#10b981" />
    <path d="M30 36 L34 40 L44 28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SRKP Badge Text -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="#ffffff">SRKP</text>
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" letter-spacing="6" fill="#94a3b8">PROPERTY</text>
</svg>
